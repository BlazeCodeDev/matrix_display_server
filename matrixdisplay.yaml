esphome:
  name: matrix-display
  friendly_name: Matrix Display

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main
    components: [hub75_matrix_display]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

ota:
  - platform: esphome
    password: "11e9bc802886dcfe5cc0f7fe1e71a00e"

logger:
  level: INFO

api:
  encryption:
    key: "LeGjKLDUHdvS1WPKIm5PFbeE3CCcUHPge48WxknCk6w="
  services:
    # Call from Home Assistant as esphome.matrix_display_set_metric with
    # a short label ("cpu", "temp", ...) and a numeric value. Shown as a
    # small status line at the bottom of the display.
    - service: set_metric
      variables:
        key: string
        value: float
      then:
        - lambda: |-
            for (size_t i = 0; i < id(ha_metric_labels).size(); i++) {
              if (id(ha_metric_labels)[i] == key) {
                id(ha_metric_values)[i] = value;
                return;
              }
            }
            if (id(ha_metric_labels).size() < 4) {
              id(ha_metric_labels).push_back(key);
              id(ha_metric_values).push_back(value);
            } else {
              id(ha_metric_labels)[0] = key;
              id(ha_metric_values)[0] = value;
            }

wifi:
  ssid: "404 Network unavailable"
  password: "85498036873100493624"

http_request:
  id: http_request_id
  useragent: esphome/matrix-display
  timeout: 10s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: device_ip

text:
  - platform: template
    name: "Matrix Server URL"
    id: server_url
    mode: text
    optimistic: true
    initial_value: "http://192.168.1.100:3000"
    restore_value: true

sensor:
  - platform: adc
    pin: GPIO3
    name: "LDR Voltage"
    id: ldr_sensor
    update_interval: 0.5s
    attenuation: auto
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - exponential_moving_average:
          alpha: 0.1
          send_every: 2
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

number:
  - platform: template
    name: "Brightness"
    id: brightness_control
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 128
    optimistic: true
  - platform: template
    name: "Animation Speed"
    id: anim_speed
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 5
    optimistic: true
  - platform: template
    name: "Min Brightness"
    id: min_brightness
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 30
    optimistic: true
  - platform: template
    name: "Max Brightness"
    id: max_brightness
    min_value: 100
    max_value: 255
    step: 5
    initial_value: 255
    optimistic: true
  - platform: template
    name: "Auto-off Threshold"
    id: auto_off_threshold
    min_value: 0.0
    max_value: 3.3
    step: 0.01
    initial_value: 0.1
    unit_of_measurement: "V"
    optimistic: true

switch:
  - platform: template
    name: "Display Power"
    id: display_power
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Auto Brightness"
    id: auto_brightness
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: target_brightness
    type: float
    initial_value: '128.0'
  - id: current_brightness
    type: float
    initial_value: '128.0'
  - id: last_ldr_check
    type: unsigned long
    initial_value: '0'
  # 64x32 RGB framebuffer polled from matrix_display_server, one byte per channel.
  - id: md_framebuffer
    type: uint8_t[6144]
  - id: md_has_design
    type: bool
    initial_value: 'false'
  # Values exposed from Home Assistant via the `set_metric` API service above.
  - id: ha_metric_labels
    type: std::vector<std::string>
  - id: ha_metric_values
    type: std::vector<float>

interval:
  # Auto brightness based on LDR - only adjusts brightness, never controls power
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(auto_brightness).state) return;

          unsigned long now = millis();
          if (now - id(last_ldr_check) < 2000) return;

          if (!id(ldr_sensor).has_state()) return;

          float voltage = id(ldr_sensor).state;
          float threshold = id(auto_off_threshold).state;

          // Map voltage to brightness (logarithmic scale)
          float min_voltage = threshold;
          float max_voltage = 3.3;
          float min_bright = id(min_brightness).state;
          float max_bright = id(max_brightness).state;

          // Clamp voltage value
          float clamped_voltage = std::min(std::max(voltage, min_voltage), max_voltage);

          // Logarithmic mapping for more natural brightness response
          float log_voltage = log10(clamped_voltage * 10);
          float log_min = log10(min_voltage * 10);
          float log_max = log10(max_voltage * 10);

          float normalized = (log_voltage - log_min) / (log_max - log_min);
          id(target_brightness) = min_bright + (normalized * (max_bright - min_bright));

          id(last_ldr_check) = now;

  # Smooth brightness transitions
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(auto_brightness).state) {
            float manual_brightness = id(brightness_control).state;
            if (id(current_brightness) != manual_brightness) {
              id(current_brightness) = manual_brightness;
              id(target_brightness) = manual_brightness;
            }
            return;
          }

          // Smooth transition to target brightness (10% per step)
          float diff = id(target_brightness) - id(current_brightness);
          if (std::abs(diff) > 1.0) {
            id(current_brightness) += diff * 0.1;

            auto call = id(brightness_control).make_call();
            call.set_value((int)id(current_brightness));
            call.perform();
          }

  # Poll matrix_display_server for the active screen's pixel data.
  - interval: 3s
    then:
      - http_request.get:
          url: !lambda |-
            std::string base = id(server_url).state;
            while (!base.empty() && base.back() == '/') base.pop_back();
            return base + "/api/esp/pixels";
          capture_response: true
          max_response_buffer_size: 80000
          on_response:
            then:
              - lambda: |-
                  if ((int)response->status_code != 200) return;
                  std::string resp_body = body;

                  // Find "key":<int> starting at or after `from`.
                  auto extract_int = [](const std::string &s, size_t from, const char *key, int &out) -> bool {
                    std::string needle = std::string("\"") + key + "\":";
                    size_t p = s.find(needle, from);
                    if (p == std::string::npos) return false;
                    p += needle.length();
                    while (p < s.length() && s[p] == ' ') p++;
                    bool neg = false;
                    if (p < s.length() && s[p] == '-') { neg = true; p++; }
                    int val = 0;
                    bool any = false;
                    while (p < s.length() && isdigit((unsigned char) s[p])) {
                      val = val * 10 + (s[p] - '0');
                      p++;
                      any = true;
                    }
                    if (!any) return false;
                    out = neg ? -val : val;
                    return true;
                  };

                  size_t frames_pos = resp_body.find("\"frames\":");
                  if (frames_pos == std::string::npos) return;

                  size_t outer_start = resp_body.find('[', frames_pos);
                  if (outer_start == std::string::npos) return;
                  size_t frame_start = resp_body.find('[', outer_start + 1);
                  if (frame_start == std::string::npos) return;

                  // Find the matching close bracket for the first frame's pixel array.
                  int depth = 0;
                  size_t frame_end = std::string::npos;
                  for (size_t i = frame_start; i < resp_body.length(); i++) {
                    if (resp_body[i] == '[') depth++;
                    else if (resp_body[i] == ']') {
                      depth--;
                      if (depth == 0) { frame_end = i; break; }
                    }
                  }
                  if (frame_end == std::string::npos) return;

                  for (int i = 0; i < 6144; i++) id(md_framebuffer)[i] = 0;

                  size_t pos = frame_start;
                  while (true) {
                    size_t obj_start = resp_body.find('{', pos);
                    if (obj_start == std::string::npos || obj_start > frame_end) break;
                    size_t obj_end = resp_body.find('}', obj_start);
                    if (obj_end == std::string::npos || obj_end > frame_end) break;

                    int x = -1, y = -1, r = 0, g = 0, b = 0;
                    extract_int(resp_body, obj_start, "x", x);
                    extract_int(resp_body, obj_start, "y", y);
                    extract_int(resp_body, obj_start, "r", r);
                    extract_int(resp_body, obj_start, "g", g);
                    extract_int(resp_body, obj_start, "b", b);

                    if (x >= 0 && x < 64 && y >= 0 && y < 32) {
                      int i = (y * 64 + x) * 3;
                      id(md_framebuffer)[i] = (uint8_t) r;
                      id(md_framebuffer)[i + 1] = (uint8_t) g;
                      id(md_framebuffer)[i + 2] = (uint8_t) b;
                    }

                    pos = obj_end + 1;
                  }

                  id(md_has_design) = true;

font:
  - file:
      url: "https://github.com/trip5/Matrix-Fonts/raw/main/6-series/MatrixLight6.ttf"
      type: web
    id: jb_tiny
    size: 6
  - file:
      url: "https://github.com/trip5/Matrix-Fonts/raw/main/8-series/MatrixLight8.ttf"
      type: web
    id: jb_small
    size: 8

display:
  - platform: hub75_matrix_display
    id: led_matrix
    width: 64
    height: 32
    chain_length: 1
    driver: FM6126A
    rotation: 180
    R1_pin: 37
    G1_pin: 35
    B1_pin: 15
    R2_pin: 36
    G2_pin: 39
    B2_pin: 16
    A_pin: 45
    B_pin: 1
    C_pin: 48
    D_pin: 2
    LAT_pin: 38
    OE_pin: 21
    CLK_pin: 47
    update_interval: 40ms

    lambda: |-
      if (!id(display_power).state) { it.clear(); return; }

      float br = id(brightness_control).state / 255.0;
      it.clear();

      Color main_c = Color(0, uint8_t(255*br), uint8_t(150*br));
      Color white_c = Color(uint8_t(255*br), uint8_t(255*br), uint8_t(255*br));
      Color dim_c = Color(uint8_t(40*br), uint8_t(40*br), uint8_t(40*br));

      if (id(md_has_design)) {
        for (int y = 0; y < 32; y++) {
          for (int x = 0; x < 64; x++) {
            int i = (y * 64 + x) * 3;
            uint8_t r = id(md_framebuffer)[i], g = id(md_framebuffer)[i+1], b = id(md_framebuffer)[i+2];
            if (r || g || b)
              it.draw_pixel_at(x, y, Color(uint8_t(r*br), uint8_t(g*br), uint8_t(b*br)));
          }
        }
      } else {
        it.print(32, 4, id(jb_small), main_c, display::TextAlign::TOP_CENTER, "DESIGN ME");
        std::string url = id(server_url).state;
        it.print(32, 15, id(jb_tiny), dim_c, display::TextAlign::TOP_CENTER, url.c_str());
      }

      if (!id(ha_metric_labels).empty()) {
        std::string metrics;
        for (size_t i = 0; i < id(ha_metric_labels).size(); i++) {
          char buf[24];
          float v = id(ha_metric_values)[i];
          if (v == (int) v) {
            snprintf(buf, sizeof(buf), "%s:%d", id(ha_metric_labels)[i].c_str(), (int) v);
          } else {
            snprintf(buf, sizeof(buf), "%s:%.1f", id(ha_metric_labels)[i].c_str(), v);
          }
          if (!metrics.empty()) metrics += " ";
          metrics += buf;
        }
        it.print(1, 25, id(jb_tiny), white_c, display::TextAlign::TOP_LEFT, metrics.c_str());
      }
